<style>
:root{color-scheme:light;--blue:#0B5FA5;--blue-d:#0D446D;--tint:#EAF2FA;--ink:#14243D;--muted:#5B6B82;--line:#DCE4EE;--bg:#F4F7FB;--card:#fff;
--c-awaiting:#98A2B3;--c-received:#0B5FA5;--c-accepted:#12A0A0;--c-followup:#E39A1B;--c-verified:#2E9E5B;--c-na:#CBD2DC;--red:#C0392B;
--r:12px;--sh:0 1px 2px rgba(20,36,61,.06),0 4px 14px rgba(20,36,61,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button,select,input,textarea{font:inherit;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{width:40px;height:40px;flex:none}
.brand b{display:block;font-size:17px;color:var(--blue);line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;flex:none}
.role{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--blue-d);font-weight:600;white-space:nowrap}
.role.ed{background:var(--blue);color:#fff}
.nav{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--blue)}
.nav a.on{color:var(--blue);border-color:var(--blue)}
.banner{padding:8px 20px;font-size:12.5px;text-align:center}
.banner.info{background:#EAF2FA;color:var(--blue-d)}
.banner.warn{background:#FFF3D6;color:#7A5300}
.banner.snap{background:#E6F5EC;color:#1E6B3F}
main{max-width:1240px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 6px}
.sub{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2>.card,.grid3>.card{margin-bottom:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;font-size:13px}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:var(--tint)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #7DB4E6;outline-offset:1px}
/* hero */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hcol{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.hc-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hc-t{font-weight:700;font-size:15px}
.hc-s{font-size:12px;color:var(--muted)}
.hc-n{font-size:12.5px;margin-top:8px;color:var(--muted)}
.hc-n b{color:var(--ink)}
.warn{color:#9A6100;font-weight:600}

.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}

.s-awaiting{background:var(--c-awaiting)}.s-received{background:var(--c-received)}.s-accepted{background:var(--c-accepted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 12px}

.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge i{margin-right:6px}
.b-awaiting{background:#EEF0F4;color:#4C566A}.b-awaiting i{background:var(--c-awaiting)}
.b-received{background:#E3EEF9;color:#0B4F8A}.b-received i{background:var(--c-received)}
.b-accepted{background:#DDF3F3;color:#0B6666}.b-accepted i{background:var(--c-accepted)}
.b-followup{background:#FFF1D4;color:#8A5A00}.b-followup i{background:var(--c-followup)}
.b-verified{background:#DFF3E7;color:#1E6B3F}.b-verified i{background:var(--c-verified)}
.b-na{background:#F1F3F6;color:#6B7688}.b-na i{background:var(--c-na)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:#EEF0F4;color:#4C566A;white-space:nowrap}
.chip.g{background:#DFF3E7;color:#1E6B3F}.chip.a{background:#FFF1D4;color:#8A5A00}.chip.r{background:#FBE3E0;color:#9B2C20}.chip.b{background:#E3EEF9;color:#0B4F8A}
.tbc{color:#9AA5B5;font-style:italic}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.late{color:var(--red);font-weight:600}.soon{color:#9A6100;font-weight:600}
/* package tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:1px solid var(--line);border-left:5px solid var(--c-awaiting);border-radius:8px;padding:10px;background:#fff;cursor:pointer;text-align:left;display:block;width:100%}

.tile .pid{font-size:11px;color:var(--muted);font-weight:700}
.tile .pn{font-weight:600;font-size:13px;margin:2px 0 8px;min-height:36px}
/* rows / bars */
.brow{display:grid;grid-template-columns:190px 1fr 92px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid #EEF2F7;cursor:pointer}
.brow:last-child{border-bottom:0}
.brow:hover .bl{color:var(--blue)}
.bl{font-weight:600}
.bn{text-align:right;font-size:12.5px;color:var(--muted)}
table.mini{width:100%;border-collapse:collapse;font-size:13px}

table.mini td{padding:7px 6px;border-bottom:1px solid #EEF2F7}
table.mini td.n,table.mini th.n{text-align:right}
.li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #EEF2F7;font-size:13px;align-items:flex-start;cursor:pointer}
.li:last-child{border-bottom:0}
.li .id{font-weight:700;min-width:64px;color:var(--blue-d)}
.empty{padding:22px;text-align:center;color:var(--muted)}
/* tracker */
.seg-tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg-tabs button{border:0;background:#fff;padding:9px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg-tabs button.on{background:var(--blue);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.filters input,.filters select,.f-in,.f-sel,textarea.f-in{border:1px solid #C9D3E0;border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.filters input{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--tint);border:1px solid #C9DBEF;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;max-height:calc(100vh - 250px)}
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.grid th{position:sticky;top:0;background:#F7F9FC;text-align:left;font-size:11.5px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap}
table.grid td{padding:8px 8px;border-bottom:1px solid #EEF2F7;vertical-align:top}

table.grid td.id small{display:block;font-weight:500;color:var(--muted);font-size:11px}
table.grid td.txt{min-width:220px;cursor:pointer}
table.grid td.txt .ws{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.f-sel{padding:4px 4px;font-size:12px;max-width:124px}
/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(20,36,61,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.dr-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dr-b{padding:16px 18px;overflow:auto;flex:1}
.dr-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#F7F9FC}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld .f-in,.fld .f-sel{width:100%;max-width:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:22px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}

.toast button{background:none;border:0;color:#9CD0FF;font-weight:700;cursor:pointer}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.sug button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:8px 10px;cursor:pointer;border-bottom:1px solid #EEF2F7;font-size:13px}
.sug button:hover{background:var(--tint)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:8px 0 8px 36px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:7px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
details.d{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;background:#fff}
details.d summary{cursor:pointer;font-weight:600}
footer{max-width:1240px;margin:0 auto;padding:6px 20px 30px;color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block}

 table.grid td[data-l]:before{content:attr(data-l);color:var(--muted);font-size:11.5px;font-weight:600;flex:none}

 table.grid tr:hover td{background:none}

@media (max-width:600px){

}
@media print{

 .printhead{display:flex!important}
}
.printhead{display:none;align-items:center;gap:12px;margin-bottom:12px;border-bottom:2px solid var(--blue);padding-bottom:8px}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#EAF2FA,#F4F7FB)}

.auth-brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.auth-brand b{display:block;color:var(--blue);font-size:17px}.auth-brand span{display:block;color:var(--muted);font-size:12px}
.auth-card h1{font-size:20px;margin-bottom:4px}
.auth-card .f-in{font-size:16px;padding:10px 12px}
.auth-err{background:#FBE3E0;color:#9B2C20;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
.auth-ok{background:#DFF3E7;color:#1E6B3F;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
.auth-foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px}
.pwrow{display:flex;gap:6px}.pwrow .f-in{flex:1;min-width:0}
.modal.wide{width:min(520px,94vw);max-height:92vh;overflow:auto}

/* ---------- helpers ---------- */
const pad2=n=>('0'+n).slice(-2);
const isoDate=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>isoDate(new Date());
const parseD=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const fmtD=s=>{const d=parseD(s);return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';};
const fmtS=s=>{const d=parseD(s);return d?d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—';};
const fmtDT=iso=>{const d=new Date(iso);return isNaN(d)?'—':d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());};
const daysTo=s=>{const d=parseD(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const okUrl=u=>/^https?:\/\//i.test(u||'');
const cut=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;};

const blankItem=()=>({resp:'',receipt:'',received:'',adequacy:'',verified:'',evidence:'',link:'',note:'',internal:'',updated:'',by:''});
function fresh(){const items={};ALL.forEach(d=>{items[d.id]=blankItem();});return{v:1,items,log:[],demo:false,config:{coordinator:'',coordEmail:'',sponsor:'',repo:'',coordDue:'',returnDue:'',cutoff:''}};}

 return fresh();
}

/* ---------- status logic ---------- */
function statusOf(it){
 if(it.receipt==='Not applicable')return'na';
 if(it.verified==='Verified')return'verified';
 if(it.receipt==='Received'){
  if(it.adequacy==='Inadequate'||it.adequacy==='Partly adequate'||it.verified==='Partially verified'||it.verified==='Unverified')return'followup';
  if(it.adequacy==='Adequate')return'accepted';
  return'received';
 }
 return'awaiting';
}
const isRecd=s=>s==='received'||s==='accepted'||s==='followup'||s==='verified';
function metrics(defs){
 const c={awaiting:0,received:0,accepted:0,followup:0,verified:0,na:0};
 defs.forEach(d=>{c[statusOf(st.items[d.id])]++;});
 const total=defs.length,app=total-c.na,recd=c.received+c.accepted+c.followup+c.verified;
 return{c,total,app,recd,ver:c.verified,pct:app?Math.round(recd/app*100):0};
}
const badge=s=>`<span class="badge b-${s}" title="${esc(STAT[s].desc)}"><i></i>${STAT[s].label}</span>`;

/* ---------- changes, log, undo ---------- */
function applyChanges(ids,patch,label){
 const ts=new Date().toISOString(),changes=[];
 ids.forEach(id=>{
  const it=st.items[id];if(!it)return;const p=Object.assign({},patch);
  if(p.receipt==='Received'&&p.received===undefined&&!it.received)p.received=today();
  let ch=false;
  Object.keys(p).forEach(f=>{const nv=p[f]==null?'':String(p[f]);if((it[f]||'')!==nv){changes.push({id,f,from:it[f]||'',to:nv});it[f]=nv;ch=true;}});
  if(ch){it.updated=ts;it.by=sess.name||'Kabo';}
 });
 if(!changes.length)return null;
 const e={id:uid(),ts,by:sess.name||'Kabo',label,ids:Array.from(new Set(changes.map(c=>c.id))),changes};
 st.log.unshift(e);if(st.log.length>3000)st.log.length=3000;save();persist(e);return e;
}
function undo(e){
 const ts=new Date().toISOString(),ch=[];
 e.changes.slice().reverse().forEach(c=>{const it=st.items[c.id];ch.push({id:c.id,f:c.f,from:it[c.f]||'',to:c.from});it[c.f]=c.from;it.updated=ts;it.by=sess.name||'Kabo';});
 const e2={id:uid(),ts,by:sess.name||'Kabo',label:'Undo: '+e.label,ids:Array.from(new Set(ch.map(c=>c.id))),changes:ch};st.log.unshift(e2);persist(e2);
 save();render();
}
function summarize(e,onlyId){
 const grp={},extra=new Set(),lab={resp:'ITGEST response',receipt:'Receipt',adequacy:'Adequacy',verified:'Verification'};
 (e.changes||[]).forEach(c=>{
  if(onlyId&&c.id!==onlyId)return;
  if(lab[c.f]){const k=c.f+'\u0001'+c.to;(grp[k]=grp[k]||[]).push(c.id);}
  else if(c.f==='link')extra.add('SharePoint link');else if(c.f==='evidence')extra.add('evidence IDs');
  else if(c.f==='note')extra.add('note');else if(c.f==='received')extra.add('received date');
 });
 const parts=Object.keys(grp).map(k=>{const a=k.split('\u0001'),ids=grp[k];return`${lab[a[0]]} → ${a[1]||BLANK[a[0]]}: ${ids.slice(0,4).join(', ')}${ids.length>4?' +'+(ids.length-4)+' more':''}`;});
 if(extra.size)parts.push('also updated: '+Array.from(extra).join(', '));
 if(!parts.length&&e.internal&&(e.changes||[]).length)return 'Internal note updated: '+(e.ids||[]).slice(0,4).join(', ');
 if(!parts.length&&!(e.changes||[]).length)return e.label||'';
 return parts.join(' · ');
}
let toastT=null;
function toast(msg,entry){
 let t=$('#toast');if(t)t.remove();
 t=document.createElement('div');t.id='toast';t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>${entry?'<button data-act="undo">Undo</button>':''}`;
 document.body.appendChild(t);t._e=entry;clearTimeout(toastT);toastT=setTimeout(()=>{const x=$('#toast');if(x)x.remove();},entry?9000:4500);
}

/* ---------- field editing ---------- */
function setField(id,f,v){
 const e=applyChanges([id],{[f]:v},'Updated '+id);
 if(e)toast(`${id}: ${FL[f]} → ${v||BLANK[f]||'cleared'}`,e);
 render();
}
function bulk(patch,label){
 const ids=Array.from(ui.sel);if(!ids.length)return;
 const e=applyChanges(ids,patch,label||'Bulk update');
 if(e)toast(`Updated ${e.ids.length} item${e.ids.length===1?'':'s'}`,e);else toast('Nothing to change');
 ui.sel.clear();render();
}

/* ---------- html builders ---------- */
function selHtml(opts,val,blank,attrs){return`<select class="f-sel" ${attrs}><option value="">${esc(blank)}</option>${opts.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}</select>`;}
function respCls(v){if(/^(Yes evidenced|A )/.test(v))return'g';if(/^(Yes unsupported|Partial|B )/.test(v))return'a';if(v==='No'||/^C /.test(v))return'r';return'';}
function ring(p){const C=163.36,d=(p/100*C).toFixed(1);return`<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#E6ECF4" stroke-width="8"/>${p>0?`<circle cx="32" cy="32" r="26" fill="none" stroke="#0B5FA5" stroke-width="8" stroke-linecap="round" stroke-dasharray="${d} ${C}"/>`:''}</svg><span>${p}%</span></div>`;}
function stack(m){if(!m.total)return'';return`<div class="stack" role="img" aria-label="Status breakdown">${ORDER.map(k=>m.c[k]?`<span class="seg s-${k}" style="width:${(m.c[k]/m.total*100).toFixed(2)}%" title="${STAT[k].label}: ${m.c[k]}"></span>`:'').join('')}</div>`;}
function legend(){return`<div class="legend">${ORDER.map(k=>`<span title="${esc(STAT[k].desc)}"><i class="s-${k}"></i>${STAT[k].label}</span>`).join('')}</div>`;}
function dueTxt(d,done){
 if(!d)return'<span class="tbc">To be confirmed</span>';
 const n=daysTo(d);let x='';
 if(done)x='';else if(n<0)x=` <span class="late">${-n} day${n===-1?'':'s'} overdue</span>`;else if(n===0)x=' <span class="soon">due today</span>';else if(n<=2)x=` <span class="soon">in ${n} day${n===1?'':'s'}</span>`;else x=` <span class="sub">in ${n} days</span>`;
 return fmtD(d)+x;
}

/* ---------- dashboard ---------- */
function heroCol(title,sub,defs){
 const m=metrics(defs);
 return`<div class="hcol"><div class="hc-top">${ring(m.pct)}<div><div class="hc-t">${title}</div><div class="hc-s">${sub}</div></div></div>${stack(m)}
 <div class="hc-n"><b>${m.recd}</b> of ${m.app} received · <b>${m.ver}</b> verified${m.c.followup?` · <span class="warn">${m.c.followup} need follow-up</span>`:''}</div></div>`;
}
function chartRecv(){
 const pts={};R.forEach(d=>{const it=st.items[d.id];if(isRecd(statusOf(it))&&it.received)pts[it.received]=(pts[it.received]||0)+1;});
 const days=Object.keys(pts).sort();
 if(!days.length)return'<div class="empty">Nothing received yet. The chart appears once the first item is logged.</div>';
 const start=parseD(days[0]),end=new Date();end.setHours(0,0,0,0);if(end<start)end.setTime(start.getTime());
 const n=Math.max(1,Math.round((end-start)/864e5));let cum=0;const s=[];
 for(let i=0;i<=n;i++){const k=isoDate(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));cum+=pts[k]||0;s.push(cum);}
 const W=Math.max(300,Math.min(1100,window.innerWidth-90)),H=170,L=34,B=24,T=10,Rr=10,mx=Math.max(R.length,cum);
 const X=i=>L+(W-L-Rr)*i/n,Y=v=>H-B-(H-B-T)*v/mx;
 const line=s.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
 const area=line+` L${X(n).toFixed(1)} ${Y(0)} L${X(0).toFixed(1)} ${Y(0)} Z`;
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative requests received"><line x1="${L}" y1="${Y(0)}" x2="${W-Rr}" y2="${Y(0)}" stroke="#DCE4EE"/><line x1="${L}" y1="${Y(mx)}" x2="${W-Rr}" y2="${Y(mx)}" stroke="#DCE4EE" stroke-dasharray="4 4"/>
 <path d="${area}" fill="#0B5FA5" opacity=".12"/><path d="${line}" fill="none" stroke="#0B5FA5" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(n)}" cy="${Y(cum)}" r="4" fill="#0B5FA5"/>
 <text x="${L-6}" y="${Y(0)+4}" text-anchor="end" font-size="11" fill="#5B6B82">0</text><text x="${L-6}" y="${Y(mx)+4}" text-anchor="end" font-size="11" fill="#5B6B82">${mx}</text>
 <text x="${L}" y="${H-6}" font-size="11" fill="#5B6B82">${fmtD(days[0])}</text><text x="${W-Rr}" y="${H-6}" text-anchor="end" font-size="11" fill="#5B6B82">Today · ${cum} received</text></svg>`;
}

function recentHtml(n){
 const list=st.log.filter(e=>!e.internal).map(e=>({e,s:summarize(e)})).filter(x=>x.s).slice(0,n);
 if(!list.length)return'<div class="empty">No updates yet.</div>';
 return list.map(x=>`<div class="li"><div class="id" style="min-width:82px;font-weight:600;color:var(--muted)">${fmtDT(x.e.ts)}</div><div style="flex:1">${esc(x.s)}<div class="sub">${esc(x.e.by)}</div></div></div>`).join('');
}

function tabDefs(){return ui.tab==='Q'?Q:ui.tab==='R'?R:P;}
function filtered(){

  const it=st.items[d.id];
  if(f.ws&&d.ws!==f.ws)return false;if(f.owner&&d.owner!==f.owner)return false;if(f.pri&&d.priority!==f.pri)return false;

 });
}

function relatedOf(ids){

 ids.forEach(id=>{const d=BY[id];if(!d)return;
  if(d.kind==='R'){Q.forEach(q=>{if(q.orig.indexOf(id)>=0){out.add(q.id);out.add(q.pkg);}});}
  else if(d.kind==='P'){Q.forEach(q=>{if(q.pkg===id){out.add(q.id);q.orig.forEach(o=>{if(BY[o])out.add(o);});}});}
  else{out.add(d.pkg);d.orig.forEach(o=>{if(BY[o])out.add(o);});}
 });
 ids.forEach(i=>out.delete(i));return Array.from(out).filter(i=>BY[i]);
}

 if(act==='signout'){sess={role:'viewer',name:''};try{sessionStorage.removeItem(SS);}catch(x){}if(location.hash==='#/update'||location.hash==='#/settings')location.hash='#/dashboard';render();return;}
 if(act==='undo'){const t=$('#toast');if(t&&t._e){undo(t._e);t.remove();}return;}

/* ================= CLOUD: sign-in, shared saving, users ================= */
const SBK='kabo_itgest_sb_v1';
const PWOK=/^(?=.*[A-Za-z])(?=.*\d).{10,72}$/;
const PWMSG='Use at least 10 characters, with at least one letter and one number.';
let auth={ready:false,screen:'login',msg:'',err:'',busy:false,session:null,profile:null,mode:'first',email:''};
let queue=[],flushing=false,syncErr='',lastSync=null,pollT=null,syncWarned=false;
const U={list:null,me:null,err:'',loading:false};
ui.form={};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
const isAdmin=()=>CLOUD_ON&&!!auth.profile&&auth.profile.active&&auth.profile.org==='Kabo'&&auth.profile.role==='admin';

function jwtSub(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(p+'='.repeat((4-p.length%4)%4))).sub||'';}catch(e){return '';}}
function setSession(j){
 const tok=j.access_token;
 auth.session={access_token:tok,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:(j.user&&j.user.id)||jwtSub(tok),email:(j.user&&j.user.email)||(auth.session&&auth.session.email)||''};
 lsSet(SBK,JSON.stringify(auth.session));
}
function clearSession(){auth.session=null;auth.profile=null;lsDel(SBK);}
async function authFetch(path,body,extra){
 const r=await fetch(CLOUD.url+'/auth/v1/'+path,Object.assign({method:'POST',headers:{apikey:CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify(body)},extra||{}));
 let j={};try{j=await r.json();}catch(e){}
 return{ok:r.ok,status:r.status,j};
}
async function freshToken(){
 const s=auth.session;if(!s)throw new Error('expired');
 if(s.expires_at-60>Date.now()/1000)return s.access_token;
 const r=await authFetch('token?grant_type=refresh_token',{refresh_token:s.refresh_token});
 if(!r.ok){clearSession();throw new Error('expired');}
 setSession(r.j);return auth.session.access_token;
}
async function rest(path,o){
 o=o||{};const tok=await freshToken();
 const r=await fetch(CLOUD.url+'/rest/v1/'+path,{method:o.method||'GET',headers:Object.assign({apikey:CLOUD.key,Authorization:'Bearer '+tok,'Content-Type':'application/json'},o.headers||{}),body:o.body!==undefined?JSON.stringify(o.body):undefined});
 if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.error||'';}catch(e){}const err=new Error(m||('HTTP '+r.status));err.status=r.status;throw err;}
 if(r.status===204)return null;
 const t=await r.text();return t?JSON.parse(t):null;
}
async function adminCall(body){
 const tok=await freshToken();
 const r=await fetch(CLOUD.url+'/functions/v1/admin-users',{method:'POST',headers:{apikey:CLOUD.key,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
 let j={};try{j=await r.json();}catch(e){}
 if(!r.ok){const err=new Error(j.error||j.message||'Request failed');err.status=r.status;throw err;}
 return j;
}
const sessionExpired=e=>!!e&&(e.message==='expired'||e.status===401);

/* ---------- boot / enter / sign out ---------- */
async function boot(){
 const h=location.hash||'';
 if(/access_token=/.test(h)&&/type=recovery/.test(h)){
  const p=new URLSearchParams(h.replace(/^#/,''));
  setSession({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_in:+p.get('expires_in')||3600});
  history.replaceState(null,'',location.pathname+location.search);
  auth.mode='recovery';auth.screen='setpw';renderAuth();return;
 }
 if(/error_code=/.test(h)){
  const p=new URLSearchParams(h.replace(/^#/,''));
  history.replaceState(null,'',location.pathname+location.search);
  auth.err=/expired|otp/i.test(p.get('error_code')||'')?'That reset link has expired or was already used. Request a new one below.':'That link is not valid. Request a new one below.';
  auth.screen='forgot';renderAuth();return;
 }
 const saved=lsGet(SBK);
 if(saved){try{auth.session=JSON.parse(saved);}catch(e){}}
 if(auth.session){await enter();return;}
 auth.screen='login';renderAuth();
}
async function enter(){
 try{
  const uid=auth.session.uid||jwtSub(auth.session.access_token);
  const rows=await rest('profiles?select=*&id=eq.'+encodeURIComponent(uid));
  const p=rows&&rows[0];
  auth.profile=p||null;
  if(!p||!p.active){auth.screen='inactive';auth.ready=false;renderAuth();return;}
  if(p.must_change_password){auth.mode='first';auth.screen='setpw';auth.ready=false;renderAuth();return;}
  sess={role:(p.org==='Kabo'&&(p.role==='admin'||p.role==='editor'))?'editor':'viewer',name:p.full_name||p.email};
  await loadCloud();
  auth.ready=true;auth.err='';startPoll();
  if(!location.hash||location.hash==='#'||location.hash==='#/')location.hash='#/dashboard';
  render();
 }catch(e){
  if(sessionExpired(e)){signOutLocal('Please sign in again.');return;}
  auth.err='Could not reach the server. Check your connection and try again.';auth.screen='login';auth.ready=false;renderAuth();
 }
}
function signOutLocal(msg){
 clearSession();auth.ready=false;auth.screen='login';auth.err=msg||'';auth.msg='';auth.busy=false;
 clearInterval(pollT);queue=[];U.list=null;ui.drawer=null;ui.modal=null;ui.form={};
 sess={role:'viewer',name:''};st=fresh();renderAuth();
}
async function signOut(){
 if(queue.length&&!confirm('Some changes have not finished saving. Sign out anyway?'))return;
 try{if(auth.session)await fetch(CLOUD.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:CLOUD.key,Authorization:'Bearer '+auth.session.access_token}});}catch(e){}
 signOutLocal('');
}

/* ---------- load / poll / save ---------- */
async function loadCloud(){
 const ed=isEd();
 const jobs=[rest('tracker_items?select=*'),rest('tracker_config?select=*&id=eq.1'),rest('tracker_log?select=*&order=ts.desc&limit=500')];
 if(ed)jobs.push(rest('tracker_internal?select=*'));
 const res=await Promise.all(jobs);
 const next=fresh();
 (res[0]||[]).forEach(r=>{if(next.items[r.id])Object.assign(next.items[r.id],{resp:r.resp||'',receipt:r.receipt||'',received:r.received||'',adequacy:r.adequacy||'',verified:r.verified||'',evidence:r.evidence||'',link:r.link||'',note:r.note||'',updated:r.updated_at||'',by:r.updated_by||''});});
 (res[3]||[]).forEach(r=>{if(next.items[r.id])next.items[r.id].internal=r.note||'';});
 const c=(res[1]&&res[1][0])||{};
 next.config={coordinator:c.coordinator||'',coordEmail:c.coord_email||'',sponsor:c.sponsor||'',repo:c.repo||'',coordDue:c.coord_due||'',returnDue:c.return_due||'',cutoff:c.cutoff||''};
 next.log=(res[2]||[]).map(l=>({id:l.id,ts:l.ts,by:l.by_name,label:l.label,ids:l.ids||[],changes:l.changes||[],internal:!!l.internal}));
 st=next;lastSync=new Date();renderSync();
}
const sig=()=>JSON.stringify(st.items)+'|'+st.log.length+'|'+(st.log[0]?st.log[0].id:'')+'|'+JSON.stringify(st.config);
async function pollOnce(){
 if(!auth.ready||queue.length||flushing||ui.drawer||ui.modal||QL.ids.length)return;
 const ae=document.activeElement;if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
 try{const before=sig();await loadCloud();if(sig()!==before)render();}
 catch(e){if(sessionExpired(e))signOutLocal('Your session has expired. Please sign in again.');}
}
function startPoll(){clearInterval(pollT);pollT=setInterval(pollOnce,45000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth.ready)pollOnce();});
function renderSync(){
 const el=$('#syncpill');if(!el)return;
 el.textContent=(queue.length||flushing)?(syncErr?'Not saved yet, retrying…':'Saving…'):('Saved'+(lastSync?' · synced '+pad2(lastSync.getHours())+':'+pad2(lastSync.getMinutes()):''));
}
function persist(e){if(!CLOUD_ON)return;queue.push({e});flush();}
async function sendJob(job){
 const e=job.e,PUBF=['resp','receipt','received','adequacy','verified','evidence','link','note'];
 const patches={},intl={};
 e.changes.forEach(c=>{
  if(c.f==='internal')intl[c.id]=c.to;
  else if(PUBF.indexOf(c.f)>=0){(patches[c.id]=patches[c.id]||{id:c.id})[c.f]=(c.f==='received'&&!c.to)?null:c.to;}
 });
 const groups={};Object.keys(patches).forEach(id=>{const p=patches[id],k=Object.keys(p).sort().join(',');(groups[k]=groups[k]||[]).push(p);});
 for(const k of Object.keys(groups))await rest('tracker_items?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:groups[k]});
 const irows=Object.keys(intl).map(id=>({id,note:intl[id]}));
 if(irows.length)await rest('tracker_internal?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:irows});
 const pubCh=e.changes.filter(c=>c.f!=='internal'),intCh=e.changes.filter(c=>c.f==='internal'),rows=[];
 if(pubCh.length||!e.changes.length)rows.push({label:e.label,ids:Array.from(new Set(pubCh.map(c=>c.id))),changes:pubCh,internal:false});
 if(intCh.length)rows.push({label:e.label,ids:Array.from(new Set(intCh.map(c=>c.id))),changes:intCh,internal:true});
 if(rows.length)await rest('tracker_log',{method:'POST',headers:{Prefer:'return=minimal'},body:rows});
}
async function flush(){
 if(flushing)return;flushing=true;syncErr='';renderSync();
 try{
  while(queue.length){
   try{await sendJob(queue[0]);queue.shift();syncWarned=false;}
   catch(err){
    if(sessionExpired(err))throw err;
    if(err.status&&err.status>=400&&err.status<500&&err.status!==429){
     queue.shift();toast('Could not save: '+err.message);
     try{await loadCloud();render();}catch(x){}
    }else throw err;
   }
  }
  lastSync=new Date();
 }catch(err){
  if(sessionExpired(err)){flushing=false;signOutLocal('Your session has expired. Please sign in again.');return;}
  syncErr=err.message||'offline';
  if(!syncWarned){syncWarned=true;toast('Changes not saved yet. Retrying automatically…');}
  setTimeout(flush,15000);
 }finally{flushing=false;renderSync();}
}
window.addEventListener('beforeunload',e=>{if(queue.length){e.preventDefault();e.returnValue='';}});
async function pushConfig(){
 const c=st.config;
 try{
  await rest('tracker_config?id=eq.1',{method:'PATCH',headers:{Prefer:'return=minimal'},body:{coordinator:c.coordinator,coord_email:c.coordEmail,sponsor:c.sponsor,repo:c.repo,coord_due:c.coordDue||null,return_due:c.returnDue||null,cutoff:c.cutoff||null}});
  await rest('tracker_log',{method:'POST',headers:{Prefer:'return=minimal'},body:[{label:'Key dates and contacts updated',ids:[],changes:[],internal:false}]});
  toast('Saved');
 }catch(e){toast('Could not save: '+e.message);}
}

/* ---------- sign-in screens ---------- */
function renderAuth(){
 const s=auth.screen,dis=auth.busy?' disabled':'';
 const err=auth.err?`<div class="auth-err" role="alert">${esc(auth.err)}</div>`:'',ok=auth.msg?`<div class="auth-ok">${esc(auth.msg)}</div>`:'';
 const pwField=(id,label,ac)=>`<div class="fld"><label for="${id}">${label}</label><div class="pwrow"><input id="${id}" name="${id}" type="password" class="f-in" autocomplete="${ac}" required><button type="button" class="btn ghost sm" data-act="pw-toggle" data-t="${id}">Show</button></div></div>`;
 let inner='';
 if(s==='login')inner=`<h1>Sign in</h1><p class="sub">Access is by invitation from Kabo Solutions.</p>${err}${ok}
  <form data-form="login"><div class="fld"><label for="a-email">Email</label><input id="a-email" name="email" type="email" class="f-in" autocomplete="username" required value="${esc(auth.email)}"></div>
  ${pwField('a-pw','Password','current-password')}<button class="btn" style="width:100%"${dis}>${auth.busy?'Signing in…':'Sign in'}</button></form>
  <p style="text-align:center;margin:14px 0 0"><a href="#" data-act="auth-forgot">Forgot password?</a></p>`;
 else if(s==='forgot')inner=`<h1>Reset your password</h1><p class="sub">Enter your email and we will send you a link to choose a new password.</p>${err}
  <form data-form="forgot"><div class="fld"><label for="a-email">Email</label><input id="a-email" name="email" type="email" class="f-in" autocomplete="username" required value="${esc(auth.email)}"></div><button class="btn" style="width:100%"${dis}>${auth.busy?'Sending…':'Send reset link'}</button></form>
  <p style="text-align:center;margin:14px 0 0"><a href="#" data-act="auth-back">Back to sign in</a></p>`;
 else if(s==='forgot-sent')inner=`<h1>Check your email</h1><div class="auth-ok">If that email has an account, a reset link is on its way. It can take a few minutes. Check your spam folder too.</div><p class="sub">Did not arrive? Email <a href="mailto:${SUPPORT}">${SUPPORT}</a> and Kabo can reset your password for you.</p><p style="text-align:center;margin:14px 0 0"><a href="#" data-act="auth-back">Back to sign in</a></p>`;
 else if(s==='setpw'){
  const t=auth.mode==='first'?['Choose your own password','Your account was set up with a temporary password. Please choose a password only you know.']:auth.mode==='recovery'?['Choose a new password','Enter the new password you would like to use.']:['Change your password','Enter the new password you would like to use.'];
  inner=`<h1>${t[0]}</h1><p class="sub">${t[1]}</p>${err}
  <form data-form="setpw">${pwField('a-new','New password','new-password')}${pwField('a-new2','Confirm new password','new-password')}<div class="reqs">${PWMSG}</div><button class="btn" style="width:100%"${dis}>${auth.busy?'Saving…':'Save password'}</button></form>
  <p style="text-align:center;margin:14px 0 0">${auth.mode==='change'?'<a href="#" data-act="pw-cancel">Cancel</a>':'<a href="#" data-act="auth-signout">Sign out</a>'}</p>`;
 }else if(s==='inactive')inner=`<h1>Account not active</h1><div class="auth-err">This account is not active. Please email ${SUPPORT}.</div><p style="text-align:center;margin:14px 0 0"><a href="#" data-act="auth-signout">Sign out</a></p>`;
 $('#app').innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="auth-brand"><img src="${LOGO}" alt="Kabo" width="44" height="44"><div><b>Evidence Request Tracker</b><span>GE Petrol · Phase 0 Retrospective Review (D1)</span></div></div>${inner}<div class="auth-foot">Need help? <a href="mailto:${SUPPORT}">${SUPPORT}</a><br>Kabo Solutions Inc. · Independent QA/QC Assurance</div></div></div>`;
 $('#layer').innerHTML='';
 const f=$('#app input');if(f)f.focus();
}
async function doLogin(email,pw){
 auth.busy=true;auth.err='';auth.email=email;renderAuth();
 let r;try{r=await authFetch('token?grant_type=password',{email:email.trim().toLowerCase(),password:pw});}catch(e){r={ok:false,status:0,j:{}};}
 auth.busy=false;
 if(!r.ok){
  const m=String(r.j.msg||r.j.error_description||'');
  auth.err=r.status===0?'Could not reach the server. Check your connection.':(r.j.error_code==='user_banned'||/banned/i.test(m))?'This account has been deactivated. Please email '+SUPPORT+'.':r.status===429?'Too many attempts. Please wait a minute and try again.':'Incorrect email or password.';
  renderAuth();return;
 }
 setSession(r.j);auth.msg='';await enter();
}
async function doForgot(email){
 auth.busy=true;auth.err='';auth.email=email;renderAuth();
 let status=0;
 try{const r=await fetch(CLOUD.url+'/auth/v1/recover?redirect_to='+encodeURIComponent(SITE),{method:'POST',headers:{apikey:CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify({email:email.trim().toLowerCase()})});status=r.status;}catch(e){}
 auth.busy=false;
 if(status===200){auth.screen='forgot-sent';}
 else auth.err=status===429?'Too many requests. Please wait a minute and try again.':'We could not send the email. Please email '+SUPPORT+' and Kabo can reset your password.';
 renderAuth();
}
async function doSetPw(pw,pw2){
 if(!PWOK.test(pw)){auth.err=PWMSG;renderAuth();return;}
 if(pw!==pw2){auth.err='The two passwords do not match.';renderAuth();return;}
 auth.busy=true;auth.err='';renderAuth();
 try{
  const tok=await freshToken();
  const r=await fetch(CLOUD.url+'/auth/v1/user',{method:'PUT',headers:{apikey:CLOUD.key,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){auth.busy=false;auth.err=(j.error_code==='same_password')?'Please choose a password different from your current one.':(j.error_code==='weak_password')?'That password is too easy to guess. Please choose a stronger one.':'Could not save the password. Please try again.';renderAuth();return;}
  try{await rest('rpc/password_changed',{method:'POST',body:{}});}catch(e){}
  auth.busy=false;const wasChange=auth.mode==='change';
  await enter();if(wasChange&&auth.ready)toast('Password updated');
 }catch(e){auth.busy=false;if(sessionExpired(e)){signOutLocal('Your session has expired. Please sign in again.');return;}auth.err='Could not save the password. Please try again.';renderAuth();}
}

/* ---------- users (admin) ---------- */
function genPw(){
 const A='ABCDEFGHJKLMNPQRSTUVWXYZ',a='abcdefghijkmnpqrstuvwxyz',D='23456789',all=A+a+D;
 const rnd=n=>{const b=new Uint32Array(1);crypto.getRandomValues(b);return b[0]%n;};
 for(;;){let s='';for(let i=0;i<12;i++)s+=all[rnd(all.length)];
  if(/[A-Z]/.test(s)&&/[a-z]/.test(s)&&(s.match(/\d/g)||[]).length>=2)return s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8);}
}
async function loadUsers(){
 U.loading=true;U.err='';
 try{const j=await adminCall({action:'list'});U.list=j.users||[];U.me=j.me;}
 catch(e){if(sessionExpired(e)){signOutLocal('Your session has expired. Please sign in again.');return;}U.err=e.message;}
 U.loading=false;if(ui.view==='users'&&auth.ready)render();
}
function vUsers(){
 if(U.list===null&&!U.loading&&!U.err)setTimeout(loadUsers,0);
 const head=`<div class="pagehead"><div><h1>Users</h1><div class="sub">Create accounts for Kabo, ITGEST and GE Petrol staff, then send each person their credentials yourself.</div></div><div class="noprint"><button class="btn" data-act="u-add">+ Add user</button></div></div>`;
 if(U.err)return head+`<div class="card"><div class="auth-err">${esc(U.err)}</div><button class="btn ghost sm" data-act="u-refresh">Try again</button></div>`;
 if(U.list===null)return head+'<div class="card empty">Loading users…</div>';
 const by={};U.list.forEach(u=>{if(u.active)by[u.org]=(by[u.org]||0)+1;});
 const sum=['Kabo','ITGEST','GE Petrol'].map(o=>`<span class="chip b">${o}: ${by[o]||0} active</span>`).join(' ');
 const rows=U.list.map(u=>{
  const me=u.id===U.me,id=`data-id="${esc(u.id)}"`;
  const stat=u.active?'<span class="badge b-verified"><i></i>Active</span>':'<span class="badge b-na"><i></i>Inactive</span>';
  return`<tr><td class="txt"><b>${esc(u.full_name||'(no name)')}</b>${me?' <span class="chip b">You</span>':''}<div class="sub">${esc(u.email)}</div></td><td data-l="Organisation">${esc(u.org)}</td><td data-l="Role">${esc(u.role)}</td><td data-l="Status">${stat}${u.must_change_password?' <span class="chip a">Must change password</span>':''}</td><td data-l="Last sign-in">${u.last_sign_in_at?fmtDT(u.last_sign_in_at):'Never'}</td>
  <td data-l="Actions"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost sm" data-act="u-reset" ${id}>Reset password</button><button class="btn ghost sm" data-act="u-edit" ${id}>Edit</button><button class="btn ghost sm" data-act="u-toggle" ${id}${me?' disabled':''}>${u.active?'Deactivate':'Activate'}</button><button class="btn danger sm" data-act="u-del" ${id}${me?' disabled':''}>Delete</button></div></td></tr>`;
 }).join('');
 return head+`<div style="margin-bottom:10px">${sum}</div><div class="tw"><table class="grid"><thead><tr><th>Name</th><th>Organisation</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function credsText(kind,name,email,pw,must){
 const first=(name||'').trim().split(/\s+/)[0]||'';
 return`Subject: Access to the GE Petrol Phase 0 Evidence Request Tracker\n\nDear ${first},\n\n`+(kind==='reset'?'Your password for the Evidence Request Tracker has been reset.':'Kabo Solutions has given you access to the Evidence Request Tracker for the GE Petrol Phase 0 retrospective review.')+`\n\nAddress: ${SITE}\nEmail: ${email}\n${kind==='reset'?'New temporary password':'Temporary password'}: ${pw}\n\n`+(must?'You will be asked to choose your own password the first time you sign in. ':'')+`If you forget your password, use "Forgot password" on the sign-in page, or contact Kabo.\n\nRegards,\n${sess.name||'Kabo Solutions'}\nKabo Solutions Inc.`;
}
function modalHtml(){
 const f=ui.form||{},m=ui.modal;
 const err=f.err?`<div class="auth-err" role="alert">${esc(f.err)}</div>`:'';
 const orgOpts=['Kabo','ITGEST','GE Petrol'].map(o=>`<option${f.org===o?' selected':''}>${o}</option>`).join('');
 const roleOpts=[['viewer','Viewer (read-only)'],['editor','Editor (updates the tracker)'],['admin','Admin (also manages users)']].map(r=>`<option value="${r[0]}"${f.role===r[0]?' selected':''}${r[0]!=='viewer'&&f.org!=='Kabo'?' disabled':''}>${r[1]}</option>`).join('');
 const pwRow=`<div class="fld"><label for="f-pw">Password (you will send this to the user)</label><div class="pwrow"><input id="f-pw" class="f-in" data-f="pw" name="pw" value="${esc(f.pw||'')}" autocomplete="off" spellcheck="false"><button type="button" class="btn ghost sm" data-act="u-gen">Generate</button></div><div class="reqs">${PWMSG}</div></div>`;
 const must=`<label style="display:flex;gap:8px;align-items:center;margin:6px 0 12px"><input type="checkbox" data-f="must" name="must"${f.must?' checked':''}> Ask the user to choose a new password at first sign-in</label>`;
 const wrapM=(title,inner)=>`<div class="scrim" data-act="close"></div><div class="modal wide" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${inner}</div>`;
 const btns=label=>`<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn"${f.busy?' disabled':''}>${f.busy?'Working…':label}</button></div>`;
 if(m==='adduser')return wrapM('Add a user',`<form data-form="adduser">${err}<div class="fld"><label>Full name</label><input class="f-in" data-f="full_name" name="full_name" value="${esc(f.full_name||'')}" required></div><div class="fld"><label>Email</label><input class="f-in" type="email" data-f="email" name="email" value="${esc(f.email||'')}" required></div><div class="two"><div class="fld"><label>Organisation</label><select class="f-sel" data-f="org" name="org">${orgOpts}</select></div><div class="fld"><label>Role</label><select class="f-sel" data-f="role" name="role">${roleOpts}</select></div></div>${pwRow}${must}${btns('Create user')}</form>`);
 if(m==='edituser')return wrapM('Edit user',`<form data-form="edituser">${err}<div class="fld"><label>Full name</label><input class="f-in" data-f="full_name" name="full_name" value="${esc(f.full_name||'')}" required></div><div class="two"><div class="fld"><label>Organisation</label><select class="f-sel" data-f="org" name="org">${orgOpts}</select></div><div class="fld"><label>Role</label><select class="f-sel" data-f="role" name="role">${roleOpts}</select></div></div>${btns('Save')}</form>`);
 if(m==='resetpw')return wrapM('Reset password',`<form data-form="resetpw"><p class="sub">${esc(f.full_name||'')} · ${esc(f.email||'')}</p>${err}${pwRow}${must}${btns('Reset password')}</form>`);
 if(m==='creds')return wrapM(f.title||'Credentials ready',`<p class="sub">Copy this message and send it to the user yourself. The password is shown only now; it cannot be looked up later.</p><textarea id="creds-text" class="f-in" rows="13" readonly style="width:100%;font-family:inherit">${esc(f.text||'')}</textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" data-act="copy-creds">Copy message</button><button class="btn ghost" data-act="close">Done</button></div>`);
 return'';
}
function renderLayer(){
 const l=$('#layer');
 if(ui.drawer){l.innerHTML=drawerHtml(ui.drawer);return;}
 if(ui.modal==='signin'){
  l.innerHTML=`<div class="scrim" data-act="close"></div><div class="modal" role="dialog" aria-label="Kabo sign-in"><h2>Kabo team sign-in</h2><p class="sub">Enter your name. It is recorded on every update you make. (Preview build: password sign-in is added when the shared database is connected.)</p><div class="fld"><label>Your name</label><input id="si-name" class="f-in" autocomplete="name" placeholder="e.g. Isaac Babson"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="signin-go">Sign in</button></div></div>`;
  const i=$('#si-name');if(i)i.focus();return;
 }
 l.innerHTML=(CLOUD_ON&&ui.modal)?modalHtml():'';
}
async function userAction(kind,body,okMsg){
 try{await adminCall(body);toast(okMsg);await loadUsers();}
 catch(e){if(sessionExpired(e)){signOutLocal('Your session has expired. Please sign in again.');return;}toast(e.message);}
}
document.addEventListener('click',async e=>{
 const a=e.target.closest('[data-act]');if(!a||!CLOUD_ON)return;
 const act=a.dataset.act,ds=a.dataset;
 if(act==='auth-forgot'){e.preventDefault();auth.screen='forgot';auth.err='';auth.msg='';renderAuth();}
 else if(act==='auth-back'){e.preventDefault();auth.screen='login';auth.err='';renderAuth();}
 else if(act==='auth-signout'){e.preventDefault();await signOut();}
 else if(act==='pw-toggle'){const i=document.getElementById(ds.t);if(i){i.type=i.type==='password'?'text':'password';a.textContent=i.type==='password'?'Show':'Hide';}}
 else if(act==='chgpw'){auth.mode='change';auth.screen='setpw';auth.err='';auth.ready=false;renderAuth();}
 else if(act==='pw-cancel'){e.preventDefault();auth.ready=true;auth.err='';render();}
 else if(act==='u-refresh'){U.err='';loadUsers();}
 else if(act==='u-add'){ui.form={org:'ITGEST',role:'viewer',must:true,pw:genPw(),err:''};ui.modal='adduser';renderLayer();}
 else if(act==='u-gen'){ui.form.pw=genPw();const i=$('#f-pw');if(i)i.value=ui.form.pw;}
 else if(act==='u-edit'){const u=(U.list||[]).find(x=>x.id===ds.id);if(!u)return;ui.form={id:u.id,full_name:u.full_name,org:u.org==='Unassigned'?'ITGEST':u.org,role:u.role,err:''};ui.modal='edituser';renderLayer();}
 else if(act==='u-reset'){const u=(U.list||[]).find(x=>x.id===ds.id);if(!u)return;ui.form={id:u.id,email:u.email,full_name:u.full_name,pw:genPw(),must:true,err:''};ui.modal='resetpw';renderLayer();}
 else if(act==='u-toggle'){const u=(U.list||[]).find(x=>x.id===ds.id);if(!u)return;
  if(confirm((u.active?'Deactivate ':'Activate ')+(u.full_name||u.email)+'?'+(u.active?' They will be signed out and unable to sign in.':'')))userAction('toggle',{action:'set_active',user_id:u.id,active:!u.active},u.active?'Deactivated':'Activated');}
 else if(act==='u-del'){const u=(U.list||[]).find(x=>x.id===ds.id);if(!u)return;
  if(confirm('Delete '+(u.full_name||u.email)+' permanently? This cannot be undone. (Deactivate instead if you might need them again.)'))userAction('del',{action:'delete',user_id:u.id},'User deleted');}
 else if(act==='copy-creds'){const t=$('#creds-text');if(!t)return;
  try{await navigator.clipboard.writeText(t.value);toast('Copied. Paste it into your email.');}catch(x){t.select();document.execCommand('copy');toast('Copied.');}}
});
document.addEventListener('submit',async e=>{
 const f=e.target.closest('form[data-form]');if(!f||!CLOUD_ON)return;
 e.preventDefault();const kind=f.dataset.form,fd=new FormData(f);
 if(kind==='login')return doLogin(String(fd.get('email')||''),String(fd.get('a-pw')||''));
 if(kind==='forgot')return doForgot(String(fd.get('email')||''));
 if(kind==='setpw')return doSetPw(String(fd.get('a-new')||''),String(fd.get('a-new2')||''));
 const F=ui.form;if(F.busy)return;
 const fail=m=>{F.err=m;F.busy=false;renderLayer();};
 try{
  if(kind==='adduser'){
   const email=String(F.email||'').trim().toLowerCase(),name=String(F.full_name||'').trim(),pw=String(F.pw||'');
   if(!name)return fail('Enter the person’s name.');
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return fail('Enter a valid email address.');
   if(!PWOK.test(pw))return fail(PWMSG);
   F.busy=true;F.err='';renderLayer();
   await adminCall({action:'create',email,full_name:name,org:F.org,role:F.role,password:pw,must_change_password:!!F.must});
   ui.form={title:'User created',text:credsText('new',name,email,pw,!!F.must)};ui.modal='creds';renderLayer();loadUsers();
  }else if(kind==='resetpw'){
   const pw=String(F.pw||'');if(!PWOK.test(pw))return fail(PWMSG);
   F.busy=true;F.err='';renderLayer();
   await adminCall({action:'reset_password',user_id:F.id,password:pw,must_change_password:!!F.must});
   ui.form={title:'Password reset',text:credsText('reset',F.full_name,F.email,pw,!!F.must)};ui.modal='creds';renderLayer();loadUsers();
  }else if(kind==='edituser'){
   const name=String(F.full_name||'').trim();if(!name)return fail('Enter the person’s name.');
   F.busy=true;F.err='';renderLayer();
   await adminCall({action:'update_profile',user_id:F.id,full_name:name,org:F.org,role:F.role});
   ui.modal=null;renderLayer();toast('Saved');loadUsers();
  }
 }catch(err){if(sessionExpired(err)){signOutLocal('Your session has expired. Please sign in again.');return;}fail(err.message||'Something went wrong.');}
});
function onFormField(t){
 if(!CLOUD_ON||t.dataset.f===undefined||!ui.form)return;
 ui.form[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;
 if(t.dataset.f==='org'){if(ui.form.org!=='Kabo'&&ui.form.role!=='viewer')ui.form.role='viewer';renderLayer();}
}
document.addEventListener('input',e=>{const t=e.target;if(t.tagName!=='SELECT'&&t.type!=='checkbox')onFormField(t);});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'||t.type==='checkbox')onFormField(t);});

if(CLOUD_ON)boot();else render();

</script>
